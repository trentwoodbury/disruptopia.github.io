<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Disruptopia - Board Game</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>DISRUPTOPIA</h1>
        <div class="tagline">
          <p>A Ruthless Engine Builder for 2-5 Players</p>
        </div>
        <div class="byline">
          <img src="selfie-in-style.png" alt="Trent Woodbury" class="avatar" />
          <p>A game by Trent Woodbury</p>
        </div>
      </header>

      <main>
        <section class="links-section">
          <h2>Game Resources</h2>
          <ul class="resource-links">
            <li>
              <a href="https://steamcommunity.com/sharedfiles/filedetails/?id=3645726380" target="_blank">Play it on TableTop Simulator</a>
            </li>
            <li>
              <a href="https://youtu.be/xKKHe32z_xY" target="_blank">Video Tutorial</a>
            </li>
            <li>
              <a href="https://docs.google.com/document/d/1sTgQBfVfYom1aQY8NZUcpkHjTB0jQUY-gw0Ghw3GbmM/edit?usp=sharing" target="_blank">Rulebook</a>
            </li>
            <li>
              <a href="https://drive.google.com/file/d/1kgigY3WuU-4wk_LQisjqFwrpEvI5x_MG/view?usp=drive_link" target="_blank">Print and Play Download</a>
            </li>
            <li>
              <a href="DisruptopiaSellSheet.pdf" target="_blank">Sell Sheet</a>
            </li>
          </ul>
        </section>

        <section class="contact-section">
          <h2>Get in Touch</h2>
          <form action="https://formspree.io/f/myznalpo" method="POST">
            <div class="form-group">
              <label for="name">Name</label>
              <input type="text" id="name" name="name" required />
            </div>
            <div class="form-group">
              <label for="email">Email</label>
              <input type="email" id="email" name="email" required />
            </div>
            <div class="form-group">
              <label for="message">Message</label>
              <textarea id="message" name="message" rows="5" required></textarea>
            </div>
            <button type="submit">Send Message</button>
          </form>
        </section>
      </main>
    </div>
  </body>
</html>
